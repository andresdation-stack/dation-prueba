<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Error {{ code }} – Dation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div style="text-align:center;color:var(--text)">
    <div style="font-size:64px;font-weight:800;color:var(--accent)">{{ code }}</div>
    <div style="font-size:18px;margin:12px 0 24px">{{ msg }}</div>
    <a href="/" style="background:var(--accent);color:#fff;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:600">
      Volver al inicio
    </a>
  </div>
</div>
</body>
</html>
