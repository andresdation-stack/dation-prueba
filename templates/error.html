{% extends "app_base.html" %}
{% block title %}Error {{ code }} – Dation{% endblock %}
{% block content %}
<div class="page-body">
  <div class="empty-state" style="padding:80px 24px">
    <i class="fas fa-exclamation-triangle"></i>
    <h3>Error {{ code }}</h3>
    <p>{{ msg }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="margin-top:20px">
      <i class="fas fa-arrow-left"></i> Volver al panel
    </a>
  </div>
</div>
{% endblock %}
