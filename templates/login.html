<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dation – Iniciar sesión</title>
  <link rel="icon" type="image/x-icon" href="/assets/D-icono.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('assets', filename='img/Sin título-1.png') }}" alt="Dation" style="height:52px;width:auto"/>
    </div>
    <div class="login-title">Bienvenido</div>
    <div class="login-sub">Ingresá tus credenciales para continuar</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="login-error"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="login-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="tu usuario" autofocus required/>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary login-btn">
        <i class="fas fa-sign-in-alt"></i> Ingresar
      </button>
    </form>

    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted)">
      ¿No tenés cuenta?
      <a href="{{ url_for('registro') }}" style="color:var(--accent);font-weight:600">Registrate acá</a>
    </div>
  </div>
</div>
</body>
</html>
