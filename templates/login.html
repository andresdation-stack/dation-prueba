<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · Dation</title>
    <link rel="icon" type="image/x-icon" href="/assets/D-icono.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="{{ url_for('home') }}" class="auth-logo">Dation</a>
        <h2>Bienvenido</h2>
        <p class="auth-sub">Ingresá tus credenciales para continuar</p>

        {% if error %}
        <div class="auth-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="auth-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Tu usuario" required autofocus />
            </div>
            <div class="auth-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required />
            </div>
            <button type="submit" class="btn-primary btn-full" style="margin-top:0.5rem">
                Iniciar sesión <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <a href="{{ url_for('home') }}" class="auth-back">
            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
    </div>
</div>
</body>
</html>
