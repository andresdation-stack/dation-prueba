<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dation – Reenviar verificación</title>
  <link rel="icon" type="image/x-icon" href="/assets/D-icono.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('assets', filename='img/Sin título-1.png') }}" alt="Dation" style="height:52px;width:auto"/>
    </div>
    <div class="login-title">Reenviar verificación</div>
    <div class="login-sub">Ingresá tu email y te enviamos un nuevo enlace</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="login-error" style="{% if cat == 'success' %}background:#14532d;border-color:#166534;color:#bbf7d0{% endif %}">
          <i class="fas fa-{% if cat == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="tu@email.com" autofocus required/>
      </div>
      <button type="submit" class="btn btn-primary login-btn">
        <i class="fas fa-paper-plane"></i> Enviar enlace
      </button>
    </form>

    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted)">
      <a href="{{ url_for('login_view') }}" style="color:var(--accent);font-weight:600">
        <i class="fas fa-arrow-left"></i> Volver al login
      </a>
    </div>
  </div>
</div>
</body>
</html>
