<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dation – Crear cuenta</title>
  <link rel="icon" type="image/x-icon" href="/assets/D-icono.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('assets', filename='img/Sin título-1.png') }}" alt="Dation" style="height:52px;width:auto"/>
    </div>
    <div class="login-title">Crear cuenta</div>
    <div class="login-sub">Completá tus datos para registrarte</div>

    {% if error %}
      <div class="login-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="login-error" style="{% if cat == 'success' %}background:#14532d;border-color:#166534;color:#bbf7d0{% endif %}">
          <i class="fas fa-{% if cat == 'success' %}check-circle{% else %}exclamation-circle{% endif %}"></i> {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="login-form">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Tu nombre" value="{{ form.nombre if form else '' }}"/>
      </div>
      <div class="form-group">
        <label>Usuario *</label>
        <input type="text" name="username" placeholder="nombre de usuario" value="{{ form.username if form else '' }}" autofocus required/>
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" placeholder="tu@email.com" value="{{ form.email if form else '' }}" required/>
      </div>
      <div class="form-group">
        <label>Contraseña *</label>
        <input type="password" name="password" placeholder="mínimo 6 caracteres" required/>
      </div>
      <div class="form-group">
        <label>Repetir contraseña *</label>
        <input type="password" name="confirm" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary login-btn">
        <i class="fas fa-user-plus"></i> Registrarse
      </button>
    </form>

    <div style="text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted)">
      ¿Ya tenés cuenta?
      <a href="{{ url_for('login_view') }}" style="color:var(--accent);font-weight:600">Ingresá acá</a>
    </div>
  </div>
</div>
</body>
</html>
